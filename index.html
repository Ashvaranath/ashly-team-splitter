<!DOCTYPE html>
<html lang="en">
<head>

  <title>Ashly Team Splitter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-sport="football">
  <img id="sportWatermark" class="sport-watermark" src="icons/football.png" alt="" aria-hidden="true" />

  <main class="page">
    <header class="page-header">
      <button type="button" id="avatarButton" class="avatar" aria-label="Open photo">
        <img src="icons/profile.jpg" alt="Ashly" />
      </button>
      <div class="titles">
        <h1 class="page-title">Ashly Team Splitter</h1>
        <p id="sportTagline" class="tagline">Fair squads. Match-ready in seconds.</p>
      </div>
      <div class="connect-wrap">
        <button type="button" id="connectButton" class="connect-button" aria-expanded="false" aria-controls="connectCloth">
          Connect me
        </button>
        <div id="connectCloth" class="connect-cloth" hidden>
          <p>Creator: <strong>Ashly Mathew</strong></p>
          <p>Email: <a href="mailto:ashvaranath@gmail.com">ashvaranath@gmail.com</a></p>
          <p>Instagram: <a href="https://www.instagram.com/ashly_varanath" target="_blank" rel="noopener noreferrer">@ashly_varanath</a></p>
        </div>
      </div>
    </header>

    <div class="sport-bar">
      <div class="sport-select" id="sportSelect">
        <button type="button" class="sport-trigger" id="sportTrigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="sport-icon" id="sportIcon"></span>
          <span class="sport-label" id="sportLabel">Football</span>
          <span class="sport-caret" aria-hidden="true"></span>
        </button>
        <ul class="sport-menu" id="sportMenu" role="listbox" hidden></ul>
      </div>
    </div>

    <section class="card">
      <div class="list-head">
        <span class="col-players">Players</span>
        <span class="col-rating">Rating</span>
        <span class="col-actions"></span>
      </div>

      <div id="playerList" class="player-list"></div>

      <p id="warning" class="warning" role="alert" aria-live="polite" hidden></p>

      <div class="actions">
        <button id="addPlayer" type="button" class="btn btn-ghost">+ Add Player</button>
        <button id="splitTeam" type="button" class="btn btn-primary">Split Team</button>
      </div>
    </section>

    <section id="result" class="result" hidden></section>

    <aside id="legend" class="legend" aria-label="Category abbreviations"></aside>
